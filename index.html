<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>newtowns.uk — coming soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@700;900&family=Barlow+Condensed:wght@600&family=Public+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --cream: #F2EEE3; --ink: #201D1B; --line: #CFC7B4; --rail-blue: #1B4B6B; --signal-red: #A73A2C; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background-color: var(--cream);
    background-image:
      repeating-linear-gradient(0deg, rgba(32,29,27,0.025) 0px, rgba(32,29,27,0.025) 1px, transparent 1px, transparent 28px),
      repeating-linear-gradient(90deg, rgba(32,29,27,0.025) 0px, rgba(32,29,27,0.025) 1px, transparent 1px, transparent 28px);
    color: var(--ink); font-family: 'Public Sans', sans-serif; line-height: 1.6;
    display: flex; align-items: center; justify-content: center; padding: 1.5rem;
  }
  .wrap { max-width: 560px; width: 100%; text-align: left; }
  .kicker {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 0.95rem;
    letter-spacing: 0.04em; color: var(--rail-blue); margin-bottom: 1.2rem;
  }
  h1 {
    font-family: 'Zilla Slab', serif; font-weight: 900;
    font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1.08; margin: 0 0 1.2rem;
  }
  .coming-soon {
    display: inline-block; font-family: 'Barlow Condensed', sans-serif; font-weight: 600;
    font-size: 0.85rem; letter-spacing: 0.03em; color: var(--signal-red);
    border: 1.5px dashed var(--signal-red); padding: 0.4rem 0.8rem; margin-bottom: 1.5rem;
  }
  p { max-width: 48ch; font-size: 1.05rem; margin: 0 0 2rem; }
  iframe { border: 1px solid var(--line); background: white; max-width: 100%; }
  footer {
    margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--line);
    font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 0.85rem; color: var(--rail-blue);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">newtowns.uk</div>
  <div class="coming-soon">Coming soon</div>
  <h1>Britain built these towns from scratch. How did they turn out?</h1>
  <p>A personal investigation into Britain's post-war new towns, starting with Telford. Subscribe for the first dispatches.</p>
  <iframe src="https://newtowns.substack.com/embed" width="480" height="150" title="Subscribe to New Towns on Substack" scrolling="no"></iframe>
  <footer>newtowns.uk · A project by journalist <a href="https://ajwb.co.uk" style="color: var(--rail-blue);">Andrew Brady</a></footer>
